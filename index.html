<!DOCTYPE html>
<html>
<head>
    <title>YOLOv8 Pure Web</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.all.min.js"></script>
    <style>
        video, canvas { position: absolute; left: 0; top: 0; }
        .container { position: relative; width: 640px; height: 640px; }
    </style>
</head>
<body>
    <div class="container">
        <video id="webcam" width="640" height="640" autoplay></video>
        <canvas id="overlay" width="640" height="640"></canvas>
    </div>

    <script>
const video = document.getElementById('webcam');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');

async function setup() {
    try {
        ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/";

        const session = await ort.InferenceSession.create('./yolov8n.onnx', {
            executionProviders: ['wasm'] 
        });
        console.log("✅ Model loaded successfully!");

        // 3. Start Webcam
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;

        video.onloadedmetadata = () => {
            console.log("🎥 Camera active, starting detection...");
            setInterval(async () => {
                const input = prepareInput(video);
                const results = await session.run({ images: input });
                
                // YOLOv8n output is usually named 'output0'
                const output = results[Object.keys(results)[0]];
                processOutput(output);
            }, 100); // Start at 10 FPS while we debug
        };
    } catch (e) {
        console.error("❌ Error:", e);
    }
}
function prepareInput(source) {
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = 640;
    tempCanvas.height = 640;
    const tCtx = tempCanvas.getContext('2d');
    
    tCtx.drawImage(source, 0, 0, 640, 640);
    
    const imageData = tCtx.getImageData(0, 0, 640, 640).data;
    const float32Data = new Float32Array(3 * 640 * 640);
    for (let i = 0; i < 640 * 640; i++) {
        float32Data[i] = imageData[i * 4] / 255.0;           // Red
        float32Data[i + 640 * 640] = imageData[i * 4 + 1] / 255.0; // Green
        float32Data[i + 2 * 640 * 640] = imageData[i * 4 + 2] / 255.0; // Blue
    }

    return new ort.Tensor('float32', float32Data, [1, 3, 640, 640]);
}
function nms(boxes, iouThreshold) {
    boxes.sort((a, b) => b.score - a.score);
    const selected = [];
    const active = new Array(boxes.length).fill(true);

    for (let i = 0; i < boxes.length; i++) {
        if (active[i]) {
            selected.push(boxes[i]);
            for (let j = i + 1; j < boxes.length; j++) {
                if (active[j] && calculateIoU(boxes[i], boxes[j]) > iouThreshold) {
                    active[j] = false; // Suppress overlapping box
                }
            }
        }
    }
    return selected;
}

function calculateIoU(box1, box2) {
    const x1 = Math.max(box1.x, box2.x);
    const y1 = Math.max(box1.y, box2.y);
    const x2 = Math.min(box1.x + box1.w, box2.x + box2.w);
    const y2 = Math.min(box1.y + box1.h, box2.y + box2.h);
    
    const intersection = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
    const union = (box1.w * box1.h) + (box2.w * box2.h) - intersection;
    return intersection / union;
}
function processOutput(tensor) {
    const data = tensor.data;
    
    ctx.clearRect(0, 0, 640, 640);
    ctx.strokeStyle = "#00FF00";
    ctx.lineWidth = 3;
    ctx.font = "16px Arial";
    ctx.fillStyle = "#00FF00";

    for (let i = 0; i < 8400; i++) {

        const score = data[4 * 8400 + i]; 
        
        if (score > 0.6) {
            const cx = data[0 * 8400 + i];
            const cy = data[1 * 8400 + i];
            const w = data[2 * 8400 + i];
            const h = data[3 * 8400 + i];

            const x = cx - w / 2;
            const y = cy - h / 2;

            ctx.strokeRect(x, y, w, h);
            ctx.fillText(`Person: ${Math.round(score * 100)}%`, x, y > 20 ? y - 5 : 10);
        }
        
    }
const filteredBoxes = nms(boxes, 0.45); 
drawBoxes(filteredBoxes);
    
}
        setup();
    </script>
</body>
</html>
